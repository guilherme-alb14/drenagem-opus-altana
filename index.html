<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body><meta name="robots" content="noindex,nofollow"><style>.pubtag{margin-top:6px;display:inline-flex;gap:8px;align-items:center;font:600 11.5px/1.2 var(--f-body);color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:4px 10px}.pubtag b{color:var(--ok)}</style><title>Drenagem Opus Altana</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;500&family=Public+Sans:wght@400;500;600&display=swap">
<style id="css">/* Layout: prancha de obra — cabeçalho com serviços, planta da rede ocupando o centro, painel de ficha/resumo à direita (empilha no celular). */
:root{
  --bg:#eef1f3; --surface:#ffffff; --surface-2:#f6f8f9; --ink:#15212a; --ink-2:#47565f; --ink-3:#77858e; --line:#d6dde2;
  --map-bg:#fbfcfc; --map-base:#bcc6cd; --map-base-2:#dfe5e9; --map-water:#b7d3e6; --map-txt:#8d9aa3;
  --accent:#1d5c86; --accent-soft:#e2edf5; --accent-ink:#ffffff;
  --ok:#1f8f45; --wip:#d38700; --none:#a6b0b7; --ok-halo:rgba(31,143,69,.26);
  --g1:#8cc58a; --g2:#4fa557; --g3:#22803a; --g4:#0b5a20;
  --sel:#1d5c86; --on-ok:#ffffff; --on-wip:#1b1100; --warn-bg:#fff4dc; --warn-ink:#7a4a00; --danger:#b3261e;
  --m0:#0f8a7a; --m1:#1d5c86; --m2:#7b4bb3; --m3:#c25a0c; --m4:#c9d1d6; --mlate:#d0342c; --wplan:#2f6fe0; --good:#1f8f45; --bad:#b3261e;
  --f-disp:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1317; --surface:#151d23; --surface-2:#1b252c; --ink:#e4ebf0; --ink-2:#a8b6c0; --ink-3:#778691; --line:#27343d;
  --map-bg:#10171c; --map-base:#3a4954; --map-base-2:#222e36; --map-water:#1f3d52; --map-txt:#62727d;
  --accent:#6aaedd; --accent-soft:#1a3244; --accent-ink:#06121b;
  --ok:#3cc463; --wip:#f0a72a; --none:#56636d; --ok-halo:rgba(60,196,99,.25);
  --g1:#2f6b37; --g2:#3a9a47; --g3:#5cc269; --g4:#96e6a0;
  --sel:#6aaedd; --on-ok:#06210f; --on-wip:#1b1100; --warn-bg:#3a2a0c; --warn-ink:#f6cf86; --danger:#ff8a80; --m0:#33c2ad; --m1:#6aaedd; --m2:#b48ae6; --m3:#f08c4a; --m4:#3f4c55; --mlate:#ff6b5e; --wplan:#7aa7ff; --good:#3cc463; --bad:#ff8a80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1317; --surface:#151d23; --surface-2:#1b252c; --ink:#e4ebf0; --ink-2:#a8b6c0; --ink-3:#778691; --line:#27343d;
  --map-bg:#10171c; --map-base:#3a4954; --map-base-2:#222e36; --map-water:#1f3d52; --map-txt:#62727d;
  --accent:#6aaedd; --accent-soft:#1a3244; --accent-ink:#06121b;
  --ok:#3cc463; --wip:#f0a72a; --none:#56636d; --ok-halo:rgba(60,196,99,.25);
  --g1:#2f6b37; --g2:#3a9a47; --g3:#5cc269; --g4:#96e6a0;
  --sel:#6aaedd; --on-ok:#06210f; --on-wip:#1b1100; --warn-bg:#3a2a0c; --warn-ink:#f6cf86; --danger:#ff8a80; --m0:#33c2ad; --m1:#6aaedd; --m2:#b48ae6; --m3:#f08c4a; --m4:#3f4c55; --mlate:#ff6b5e; --wplan:#7aa7ff; --good:#3cc463; --bad:#ff8a80; color-scheme:dark}

html,body,#root{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-body)}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.app{display:flex;flex-direction:column;height:100%;padding-inline:16px;padding-block:12px;gap:10px}

/* Cabeçalho */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 24px}
.brand .eyebrow{font:600 11px/1 var(--f-disp);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.brand h1{margin:4px 0 2px;font:700 26px/1.05 var(--f-disp);letter-spacing:.01em;text-wrap:balance}
.brand .sub{color:var(--ink-2);font-size:13px}
.when{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;font-size:13px;color:var(--ink-2)}
.when label{display:flex;align-items:center;gap:8px;font:600 12px/1 var(--f-disp);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
input[type=date]{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font:500 13px var(--f-mono)}

/* Abas de serviço */
.svcbar{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.svc{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-width:112px;padding:8px 12px 9px;border:1px solid var(--line);background:var(--surface);border-radius:8px;text-align:left}
.svc .n{font:600 14px/1.1 var(--f-disp);letter-spacing:.02em}
.svc .p{display:flex;align-items:center;gap:6px;font:500 11px/1 var(--f-mono);color:var(--ink-3)}
.svc .bar{width:54px;height:4px;border-radius:2px;background:var(--map-base-2);overflow:hidden}
.svc .bar i{display:block;height:100%;background:var(--ok)}
.svc[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.svc[aria-pressed=true] .p{color:inherit;opacity:.85}
.svc[aria-pressed=true] .bar{background:color-mix(in srgb,currentColor 28%,transparent)}
.svc[aria-pressed=true] .bar i{background:currentColor}

/* Barra de edição */
.editbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:8px 12px;border:1px dashed var(--accent);background:var(--accent-soft);border-radius:8px;font-size:13px}
.editbar .tag{font:700 11px/1 var(--f-disp);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.editbar label{display:flex;align-items:center;gap:6px}
.editbar .spacer{flex:1 1 auto}
.pending{font:500 12px var(--f-mono);color:var(--ink-2)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 12px;font-weight:600;font-size:13px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent}
.switch{display:inline-flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
.switch input{accent-color:var(--accent);width:16px;height:16px}

/* Principal */
.main{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:12px;min-height:0;flex:1 1 auto}
.map{position:relative;background:var(--map-bg);border:1px solid var(--line);border-radius:10px;overflow:hidden;min-height:0}
.map svg{display:block;width:100%;height:100%;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.map svg.dragging{cursor:grabbing}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:auto;min-height:0;display:flex;flex-direction:column}

/* Camadas do mapa */
.base path{fill:none;stroke:var(--map-base);stroke-width:calc(var(--k)*0.7px)}
.base .L-CALCADA,.base .L-LOTES{stroke:var(--map-base-2)}
.base .L-LAGO,.base .L-CORREGO{stroke:var(--map-water);stroke-width:calc(var(--k)*1.4px)}
.base .L-APP{stroke:var(--map-water);stroke-dasharray:calc(var(--k)*5px) calc(var(--k)*4px)}
.base .L-GO{stroke:var(--map-base);stroke-width:calc(var(--k)*1.2px)}
.mtxt{fill:var(--map-txt);font-family:var(--f-disp);font-weight:600;letter-spacing:.12em;pointer-events:none}
.mtxt.rua{font-size:calc(var(--k)*10px);display:none}
.mtxt.qd{font-size:calc(var(--k)*10px);text-anchor:middle;dominant-baseline:central;display:none;letter-spacing:0}
svg.z1 .mtxt.rua,svg.z1 .mtxt.qd{display:inline}
.oth{stroke:var(--map-base);stroke-width:calc(var(--k)*1.5px);stroke-linecap:round}
.tl{fill:none;stroke:var(--none);stroke-width:calc(var(--k)*2.6px);stroke-linecap:round}
.tl.ram{stroke-width:calc(var(--k)*1.6px)}
.tl.s1,.tl.w{stroke-dasharray:calc(var(--k)*7px) calc(var(--k)*4.5px)}
.tl.s1{stroke:var(--wip);stroke-width:calc(var(--k)*4px)}
.tl.s2{stroke:var(--ok);stroke-width:calc(var(--k)*4.6px)}
.tl.g0.w{stroke:var(--wip);stroke-width:calc(var(--k)*4px)}
.tl.g1{stroke:var(--g1);stroke-width:calc(var(--k)*4.4px)}
.tl.g2{stroke:var(--g2);stroke-width:calc(var(--k)*4.4px)}
.tl.g3{stroke:var(--g3);stroke-width:calc(var(--k)*4.6px)}
.tl.g4{stroke:var(--g4);stroke-width:calc(var(--k)*4.8px)}
.tl.ram.s1,.tl.ram.s2,.tl.ram.g1,.tl.ram.g2,.tl.ram.g3,.tl.ram.g4,.tl.ram.g0.w{stroke-width:calc(var(--k)*2.6px)}
.halo{fill:none;stroke:var(--ok-halo);stroke-width:calc(var(--k)*13px);stroke-linecap:round;display:none}
.halo.on{display:inline}
.selhalo{fill:none;stroke:var(--sel);stroke-opacity:.38;stroke-width:calc(var(--k)*14px);stroke-linecap:round;pointer-events:none}
.selring{fill:none;stroke:var(--sel);stroke-width:calc(var(--k)*3px);pointer-events:none}
.hit{fill:none;stroke:transparent;stroke-width:calc(var(--k)*16px);stroke-linecap:round;pointer-events:stroke;cursor:pointer}
.hit.rh{stroke-width:calc(var(--k)*9px)}
.bl{fill:var(--map-bg);stroke:var(--ink-3);stroke-width:calc(var(--k)*1px);display:none;pointer-events:none}
svg.z1 .bl{display:inline}
.pv{fill:var(--map-bg);stroke:var(--ink-3);stroke-width:calc(var(--k)*1.6px);pointer-events:none}
.pv.s1{fill:var(--wip);fill-opacity:.35;stroke:var(--wip);stroke-width:calc(var(--k)*2.2px)}
.pv.s2{fill:var(--ok);stroke:var(--surface);stroke-width:calc(var(--k)*1.4px)}
.pv.g1{fill:var(--g2);stroke:var(--surface)}
.pv.g2{fill:var(--g4);stroke:var(--surface)}
.pv.w{stroke:var(--wip);stroke-width:calc(var(--k)*2.2px)}
.pvhit{fill:transparent;cursor:pointer}
.pvl{font:600 calc(var(--k)*10.5px) var(--f-mono);fill:var(--ink-2);paint-order:stroke;stroke:var(--map-bg);stroke-width:calc(var(--k)*3px);display:none;pointer-events:none}
svg.z2 .pvl{display:inline}
.dim{opacity:.18}
.off{display:none!important}
.lanc{fill:var(--accent);pointer-events:none}

/* Sobreposições do mapa */
.ov{position:absolute;display:flex;gap:6px;align-items:center}
.ov.tl-{top:10px;left:10px;flex-wrap:wrap;right:64px}
.ov.tr-{top:10px;right:10px;flex-direction:column}
.ov.bl-{bottom:10px;left:10px;right:110px;flex-wrap:wrap;align-items:flex-end}
.ov.br-{bottom:10px;right:10px;flex-direction:column;align-items:flex-end;gap:4px}
.chipset{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:2px;gap:2px}
.chipset button{border:0;background:transparent;padding:4px 9px;border-radius:5px;font:600 12px/1.2 var(--f-disp);letter-spacing:.04em;color:var(--ink-2)}
.chipset button[aria-pressed=true]{background:var(--accent-soft);color:var(--accent)}
.mapbtn{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);border-radius:7px;font:600 17px/1 var(--f-mono);color:var(--ink)}
.legend{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-2);max-width:100%}
.legend .t{width:100%;font:600 11px/1 var(--f-disp);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.lg{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.lg svg{width:26px;height:12px;flex:none}
.scale{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font:500 11px var(--f-mono);color:var(--ink-2);display:flex;flex-direction:column;gap:3px}
.scale i{display:block;height:5px;border:1.5px solid var(--ink-2);border-top:0}
.north{font:700 12px/1 var(--f-disp);color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:4px 7px}

/* Painel */
.ptabs{display:flex;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:2}
.ptabs button{flex:1;border:0;background:none;padding:11px 8px 10px;font:600 13px/1 var(--f-disp);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);border-bottom:2px solid transparent}
.ptabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
.pbody{padding:14px 16px 18px;display:flex;flex-direction:column;gap:16px}
.sec h3{margin:0 0 8px;font:600 12px/1 var(--f-disp);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.hero{display:flex;align-items:baseline;gap:10px}
.hero .big{font:700 42px/1 var(--f-disp)}
.hero .of{color:var(--ink-2);font-size:13px}
.meter{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--map-base-2);gap:2px}
.meter i{display:block;height:100%}
.meter .m2{background:var(--ok)}.meter .m1{background:var(--wip)}
.kv{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;font-size:13px}
.kv .dot{width:10px;height:10px;border-radius:50%}
.kv .v{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
.mini{display:grid;gap:10px}
.mrow{display:grid;grid-template-columns:128px 1fr 46px;gap:10px;align-items:center;font-size:13px;border:0;background:none;padding:0;text-align:left;width:100%}
.mrow .meter{height:8px}
.mrow .v{font-family:var(--f-mono);text-align:right;font-size:12px}
.mrow:hover .lab{color:var(--accent)}
.mrow .lab small,.srow .pw{display:block;font:500 11px/1.3 var(--f-mono);color:var(--ink-3);letter-spacing:0;margin-top:2px}
.note{font-size:12px;color:var(--ink-3)}
.log{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:12.5px}
.log li{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding-bottom:6px;color:var(--ink-2)}
.log li .mono{color:var(--ink)}

.fhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.fhead .k{font:600 11px/1 var(--f-disp);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.fhead h2{margin:5px 0 2px;font:700 22px/1.1 var(--f-disp)}
.fhead .r{color:var(--ink-2);font-size:13px}
.x{border:1px solid var(--line);background:var(--surface);border-radius:6px;width:30px;height:30px;font-size:16px;line-height:1;color:var(--ink-2);flex:none}
.specs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.specs div{background:var(--surface);padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.specs span{font:600 10.5px/1 var(--f-disp);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.specs b{font:500 13.5px var(--f-mono);font-variant-numeric:tabular-nums}
.srow{display:grid;gap:7px;padding:10px 0;border-top:1px solid var(--line)}
.srow:first-of-type{border-top:0;padding-top:2px}
.srow .h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.srow .n{font:600 15px/1 var(--f-disp);letter-spacing:.02em}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border-radius:999px;font:600 11.5px/1.2 var(--f-disp);letter-spacing:.04em;white-space:nowrap;border:1px solid var(--line);color:var(--ink-2)}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;border:1.5px solid var(--none)}
.chip.c1{color:var(--warn-ink);border-color:var(--wip)}
.chip.c1::before{border-color:var(--wip);background:linear-gradient(90deg,var(--wip) 50%,transparent 50%)}
.chip.c2{color:var(--ok);border-color:var(--ok)}
.chip.c2::before{background:var(--ok);border-color:var(--ok)}
.chip.c2::after{content:"✓";font-size:11px}
.dates{font-size:12.5px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:4px 12px}
.dates label{display:flex;align-items:center;gap:6px}
.dates input{padding:3px 6px;font-size:12px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;border-left:1px solid var(--line);background:var(--surface);padding:7px 4px;font:600 12.5px/1.15 var(--f-disp);letter-spacing:.02em;color:var(--ink-2)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed=true][data-v="0"]{background:var(--surface-2);color:var(--ink)}
.seg button[aria-pressed=true][data-v="1"]{background:var(--wip);color:var(--on-wip)}
.seg button[aria-pressed=true][data-v="2"]{background:var(--ok);color:var(--on-ok)}
.flag{font-size:12px;color:var(--warn-ink);background:var(--warn-bg);border-radius:6px;padding:6px 8px}
.unsaved{font:600 10.5px/1 var(--f-disp);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:3px 5px}
.links{display:flex;flex-wrap:wrap;gap:6px}
.links button{border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:4px 8px;font:500 12px var(--f-mono)}

.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:8px 10px}
.lhead{display:flex;flex-direction:column;gap:8px}
.rows{list-style:none;margin:0;padding:0}
.rows li button{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;border:0;border-bottom:1px solid var(--line);background:none;padding:8px 2px;text-align:left}
.rows li button:hover{background:var(--surface-2)}
.rows .id{font:500 13px var(--f-mono)}
.rows .meta{grid-column:1;font-size:12px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rows .chip{grid-row:1 / span 2;grid-column:2}
.empty{color:var(--ink-3);font-size:13px;padding:10px 0}

.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:8px;font-size:13px;max-width:min(560px,calc(100% - 32px));box-shadow:0 6px 24px rgba(0,0,0,.18);z-index:20}
@media (max-width:900px){
  html,body,#root{height:auto}
  .app{height:auto}
  .main{grid-template-columns:minmax(0,1fr)}
  .map{height:64vh;min-height:380px}
  .panel{overflow:visible}
  .ptabs{position:static}
  .brand h1{font-size:23px}
}
@media (max-width:520px){
  .ov.bl-{right:10px;bottom:56px}
  .legend{font-size:11px;padding:6px 8px;gap:4px 10px}
  .legend .t{display:none}
  .mrow{grid-template-columns:112px 1fr 42px}
}
@media (prefers-reduced-motion:no-preference){.svc,.btn,.seg button{transition:background-color .15s,border-color .15s,color .15s}}

/* ---------- telas (navegação) ---------- */
.views{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:thin;flex:none}
.views button{flex:0 0 auto;border:0;background:none;padding:9px 14px 10px;font:600 15px/1 var(--f-disp);letter-spacing:.04em;color:var(--ink-3);border-bottom:3px solid transparent;margin-bottom:-1px}
.views button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
.views button:hover{color:var(--ink)}
.svcbar,.editbar,.ctxbar,.top{flex:none}
.ctxbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.wknav{display:flex;align-items:center;gap:8px}
.wkt{display:flex;flex-direction:column;gap:2px;min-width:150px}
.wkt b{font:700 17px/1 var(--f-disp)}
.wkt span{font-size:12px;color:var(--ink-2)}
.wkstat{font-size:13px;color:var(--ink-2)}
.wknav .mapbtn{width:32px;height:32px}

/* mapa: planejamento e programação */
.tl.pl{stroke-width:calc(var(--k)*3.6px);stroke-dasharray:calc(var(--k)*7px) calc(var(--k)*4px)}
.tl.ram.pl{stroke-width:calc(var(--k)*2.2px)}
.tl.m0{stroke:var(--m0)}.tl.m1{stroke:var(--m1)}.tl.m2{stroke:var(--m2)}.tl.m3{stroke:var(--m3)}.tl.m4{stroke:var(--m4);stroke-dasharray:none;stroke-width:calc(var(--k)*2.2px)}
.tl.pdone{stroke:var(--ok);stroke-dasharray:none;stroke-width:calc(var(--k)*4.4px)}
.tl.ram.pdone{stroke-width:calc(var(--k)*2.6px)}
.tl.plate{stroke:var(--mlate);stroke-width:calc(var(--k)*4.4px)}
.tl.wpend{stroke:var(--wplan);stroke-width:calc(var(--k)*5px)}
.tl.wok{stroke:var(--ok);stroke-width:calc(var(--k)*5px)}
.tl.wnao{stroke:var(--danger);stroke-width:calc(var(--k)*5px)}
.tl.ram.wpend,.tl.ram.wok,.tl.ram.wnao{stroke-width:calc(var(--k)*3px)}
.pv.wpend{fill:var(--wplan);stroke:var(--surface)}
.pv.wnao{fill:var(--danger);stroke:var(--surface)}
.mdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:0}
.mdot.m0{background:var(--m0)}.mdot.m1{background:var(--m1)}.mdot.m2{background:var(--m2)}.mdot.m3{background:var(--m3)}.mdot.m4{background:var(--m4)}
.chip.cbad{color:var(--danger);border-color:var(--danger)}
.chip.cbad::before{background:var(--danger);border-color:var(--danger)}
.chip.cplan{color:var(--wplan);border-color:var(--wplan)}
.chip.cplan::before{background:var(--wplan);border-color:var(--wplan)}

/* painel lateral: tabelas e formulários */
.tbl{overflow-x:auto}
.tbl table{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{padding:6px 5px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.tbl thead th{font:600 11px/1.2 var(--f-disp);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl tbody th{font-weight:500}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.good{color:var(--good)}.bad{color:var(--bad)}
.tbl td.bad{font-weight:600}
.mseg{grid-template-columns:repeat(4,1fr)}
.seg.two{grid-template-columns:1fr 1fr}
.seg button[aria-pressed=true]:not([data-v]){background:var(--accent);color:var(--accent-ink)}
.items{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.items li{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;align-items:center;gap:4px 8px;border-bottom:1px solid var(--line);padding-bottom:6px;font-size:12.5px}
.items .ilink{border:0;background:none;padding:0;text-align:left;font:500 12.5px var(--f-mono);color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.items .ilink:hover{color:var(--accent)}
.items .cause{grid-column:1 / -1}
.items select,.sim select,.sim input,.form2 input,.obs textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:5px 7px;font-size:13px}
.x.sm{width:24px;height:24px;font-size:14px}
.form2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form2 label,.obs{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink-2)}
.obs{margin-top:10px}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}

/* ---------- painel geral ---------- */
.dash{flex:1 1 auto;min-height:0;overflow:auto}
.dgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding-bottom:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.span2{grid-column:span 2}
.card h3{margin:0;font:600 12.5px/1.2 var(--f-disp);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.card h4{margin:4px 0 0;font:600 13px/1.2 var(--f-disp);letter-spacing:.04em;color:var(--ink-2)}
.card .btn{align-self:flex-start}
.metarow{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:flex-end}
.metarow .hero .big{font-size:52px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:10px;flex:1 1 420px}
.kpis.two{grid-template-columns:1fr 1fr;flex:none}
.kpis div{display:flex;flex-direction:column;gap:3px;border-left:3px solid var(--line);padding-left:9px}
.kpis span{font:600 11px/1.2 var(--f-disp);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.kpis b{font:600 22px/1.1 var(--f-mono)}
.kpis small{font-size:11.5px;color:var(--ink-3)}
.kpis .good{border-left-color:var(--good)}.kpis .bad{border-left-color:var(--bad)}
.kpis .good b{color:var(--good)}.kpis .bad b{color:var(--bad)}
.gauge{position:relative;height:16px;border-radius:8px;background:var(--map-base-2);margin:18px 0 4px}
.gauge i{position:absolute;top:0;bottom:0;display:block}
.gauge .gd{left:0;background:var(--ok);border-radius:8px 0 0 8px}
.gauge .gp{background:repeating-linear-gradient(135deg,var(--wplan) 0 5px,color-mix(in srgb,var(--wplan) 45%,transparent) 5px 10px);opacity:.75}
.gauge b{position:absolute;top:-6px;bottom:-6px;width:3px;margin-left:-1.5px;background:var(--ink)}
.gauge b span{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font:600 11px/1 var(--f-disp);letter-spacing:.06em;white-space:nowrap;color:var(--ink);padding-bottom:3px;text-transform:uppercase}
.gauge em{position:absolute;top:-3px;bottom:-3px;width:0;border-left:2px dashed var(--m1)}
.glegend,.clegend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--ink-2)}
.glegend i,.clegend i{display:inline-block;width:18px;height:8px;border-radius:2px;margin-right:6px;vertical-align:0}
.glegend .gd{background:var(--ok)}.glegend .gp{background:var(--wplan);opacity:.6}.glegend .ge{height:0;border-top:2px dashed var(--m1);border-radius:0}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{stroke:var(--ink-3);stroke-width:1}
.chart .tick{stroke:var(--ink-3)}
.chart .ax{fill:var(--ink-3);font:500 10.5px var(--f-mono)}
.chart .ax.sub{font-size:9.5px;opacity:.8}
.chart .vl{fill:var(--ink-2);font:600 10.5px var(--f-disp);letter-spacing:.06em;text-transform:uppercase}
.chart polyline{fill:none;stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}
.chart .sLB{stroke:var(--m1);stroke-dasharray:6 4}
.chart .sVG{stroke:var(--m2);stroke-dasharray:2 4}
.chart .sR{stroke:var(--ok);stroke-width:3}
.chart .sP{stroke:var(--wplan);stroke-dasharray:3 3;opacity:.9}
.chart circle.pt{stroke:var(--surface);stroke-width:1.5}
.chart circle.sR{fill:var(--ok)}.chart circle.sP{fill:var(--wplan)}
.chart .hmeta{stroke:var(--ink);stroke-width:1.4;stroke-dasharray:2 3}
.chart .vprazo{stroke:var(--danger);stroke-width:1.4;stroke-dasharray:4 3}
.chart .vhoje{stroke:var(--ink-3);stroke-width:1}
.chart .bar{fill:var(--accent)}
.chart .bar.hist{fill:color-mix(in srgb,var(--accent) 45%,var(--surface))}
.chart .bar.cur{opacity:.55}
.chart .bar.ppc{fill:var(--ok)}
.chart .metab{stroke:var(--m3);stroke-width:2.6;stroke-linecap:round}
.chart .progpt{fill:var(--surface);stroke:var(--wplan);stroke-width:2}
.clegend .sLB{height:0;border-top:2px dashed var(--m1);border-radius:0}
.clegend .sVG{height:0;border-top:2px dotted var(--m2);border-radius:0}
.clegend .sR{background:var(--ok);height:3px}
.clegend .sP{height:0;border-top:2px dashed var(--wplan);border-radius:0}
.clegend .bh{background:color-mix(in srgb,var(--accent) 45%,var(--surface))}
.clegend .ba{background:var(--accent)}
.clegend .bm{background:var(--m3);height:3px}
.clegend .bp{width:9px;height:9px;border-radius:50%;border:2px solid var(--wplan);background:var(--surface)}
.sim label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink-2)}
.sim small{font-size:11px;color:var(--ink-3)}
.form3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sim .rs{justify-content:flex-end}
.simout{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.simout div{display:flex;flex-direction:column;gap:3px;background:var(--surface-2);border-radius:8px;padding:10px 12px}
.simout span{font:600 11px/1.2 var(--f-disp);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.simout b{font:600 24px/1.1 var(--f-mono)}
.simout .good b{color:var(--good)}.simout .bad b{color:var(--bad)}
.causes{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:12.5px}
.causes li{display:grid;grid-template-columns:minmax(0,1fr) 90px 26px;gap:8px;align-items:center}
.causes i{display:block;height:8px;border-radius:4px;background:var(--danger);opacity:.75}
.causes b{text-align:right}
@media (max-width:1200px){.dgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.card.span2{grid-column:1 / -1}}
@media (max-width:760px){.dgrid{grid-template-columns:minmax(0,1fr)}.card.span2{grid-column:auto}.metarow .hero .big{font-size:42px}.form3{grid-template-columns:1fr 1fr}.mseg{grid-template-columns:repeat(3,1fr)}}
@media (max-width:900px){.dash{overflow:visible}}

.sim .chk{flex-direction:row;align-items:center;gap:8px;font-size:12.5px;color:var(--ink)}
.sim .chk input{width:16px;height:16px;accent-color:var(--accent)}
.adjnote{background:var(--surface-2);border-radius:8px;padding:8px 10px;margin:0}

.funnel{display:grid;gap:7px}
.frow{display:grid;grid-template-columns:170px minmax(0,1fr) 92px;gap:10px;align-items:center;font-size:13px}
.frow .fl em{font:600 10px/1 var(--f-disp);letter-spacing:.1em;text-transform:uppercase;font-style:normal;color:var(--accent-ink);background:var(--accent);border-radius:3px;padding:2px 4px;margin-left:4px;vertical-align:1px}
.frow.fmeta .fl{font-weight:600}
.frow .fb{position:relative;height:10px;border-radius:5px;background:var(--map-base-2)}
.frow .fb i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--g2)}
.frow.fmeta .fb i{background:var(--ok)}
.frow .fb b{position:absolute;top:-3px;bottom:-3px;width:2px;margin-left:-1px;background:var(--ink)}
.frow .fv{text-align:right;font-size:12.5px;display:flex;flex-direction:column;line-height:1.15}
.frow .fv small{font-size:10.5px;color:var(--ink-3)}
.panel .frow{grid-template-columns:118px minmax(0,1fr) 70px;font-size:12.5px}
.simout{grid-template-columns:1fr 1fr}
.simout b.sm{font-size:18px}
.simout .bad b.sm{color:var(--bad)}
.laglist{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.laglist button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;border:0;border-bottom:1px solid var(--line);background:none;padding:6px 2px;text-align:left;font-size:12.5px}
.laglist button:hover{background:var(--surface-2)}
.laglist span{display:flex;flex-direction:column;font-family:var(--f-mono)}
.laglist small{font:11px var(--f-body);color:var(--ink-3)}
.laglist b{color:var(--bad)}
@media (max-width:520px){.frow{grid-template-columns:110px minmax(0,1fr) 70px}}

.simtools{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.card .kpis.two{margin-bottom:4px}

.items .iact{grid-column:1 / -1;display:flex;gap:6px;justify-content:flex-end}
.btn.mini{padding:3px 9px;font-size:12px}
.btn.mini.ok{border-color:var(--ok);color:var(--ok);background:var(--surface)}
.btn.mini.ok:hover{background:var(--ok);color:var(--on-ok)}
.pstat{display:grid;gap:6px;margin-top:4px;padding-top:8px;border-top:1px dashed var(--line)}

.hero.sm .big{font-size:30px}
.mgauge{position:relative;height:10px;border-radius:5px;background:var(--map-base-2);margin-top:10px}
.mgauge i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--ok)}
.mgauge b{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;background:var(--ink)}

.kpis .kmeta{border-left-color:var(--ok)}
.kpis .kmeta b{color:var(--ok)}

/* ---------- painel v2: faixa de indicadores + grade de 12 colunas ---------- */
.dash{padding-bottom:16px}
.kstrip{display:grid;grid-template-columns:minmax(0,1.55fr) repeat(4,minmax(0,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px 13px;display:flex;flex-direction:column;gap:4px;min-width:0;position:relative}
.tl-l{font:600 11.5px/1.2 var(--f-disp);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.tl-v{font:650 30px/1.1 var(--f-body);font-variant-numeric:lining-nums tabular-nums;letter-spacing:-.01em;color:var(--ink);margin-top:auto;display:flex;align-items:baseline;gap:6px}
.tl-s{font-size:12px;line-height:1.35;color:var(--ink-3)}
.tl-i{font-style:normal;font-size:.5em;line-height:1;transform:translateY(-.35em)}
.tile.hero{display:flex;flex-direction:column;align-items:stretch;gap:4px;background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 30%,var(--line))}
.tile.hero .tl-l{color:var(--accent)}
.tile.hero .tl-v{font:700 58px/1 var(--f-body);font-variant-numeric:lining-nums proportional-nums;letter-spacing:-.025em}
.tile.hero .tl-s{color:var(--ink-2)}
.tile.st-bad,.tile.st-good{padding-left:19px}
.tile.st-bad::before,.tile.st-good::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:0 3px 3px 0;background:var(--bad)}
.tile.st-good::before{background:var(--good)}
.tile.st-bad .tl-v{color:var(--bad)}.tile.st-good .tl-v{color:var(--good)}
.more{font-size:12.5px;color:var(--ink-2)}
.more>summary{cursor:pointer;color:var(--accent);font-weight:600;width:max-content;max-width:100%;list-style-position:inside}
.more>summary:hover{text-decoration:underline}
.more[open]>summary{margin-bottom:6px}
.more .note{margin:0}
.howto{margin:8px 2px 12px}
.dgrid2{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px}
.dgrid2 .c8{grid-column:span 8}.dgrid2 .c6{grid-column:span 6}.dgrid2 .c4{grid-column:span 4}
.dgrid2 .card{gap:12px;padding:16px 18px}
.chd{display:flex;justify-content:space-between;align-items:flex-start;gap:8px 14px;flex-wrap:wrap}
.chd>div{min-width:0}
.dgrid2 .card h3{font:600 17px/1.2 var(--f-disp);letter-spacing:.02em;text-transform:none;color:var(--ink)}
.csub{margin:3px 0 0;font-size:12.5px;color:var(--ink-3);line-height:1.35}
.dgrid2 .card h4{margin:6px 0 -4px;font:600 12px/1.2 var(--f-disp);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.mini2{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mini2.two{grid-template-columns:1fr 1fr}
.mini2.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.mini2>div{display:flex;flex-direction:column;gap:2px;background:var(--surface-2);border-radius:8px;padding:9px 11px;min-width:0;position:relative}
.mini2 span{font:600 10.5px/1.2 var(--f-disp);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.mini2 b{font:650 21px/1.15 var(--f-body);font-variant-numeric:lining-nums tabular-nums;color:var(--ink)}
.mini2 small{font-size:11.5px;color:var(--ink-3);line-height:1.3}
.mini2 .st-bad,.mini2 .st-good{box-shadow:inset 3px 0 0 var(--bad)}
.mini2 .st-good{box-shadow:inset 3px 0 0 var(--good)}
.mini2 .st-bad b{color:var(--bad)}.mini2 .st-good b{color:var(--good)}
.mini2 .st-bad b::after,.mini2 .st-good b::after{content:"!";display:inline-grid;place-items:center;width:15px;height:15px;margin-left:6px;border-radius:50%;font:700 10px/1 var(--f-body);vertical-align:3px;background:var(--bad);color:var(--surface)}
.mini2 .st-good b::after{content:"✓";background:var(--good)}
.dgrid2 .c4 .frow{grid-template-columns:118px minmax(0,1fr) 72px;font-size:12.5px}
.dgrid2 .gauge{margin-top:22px}
.dgrid2 .tbl table{font-size:12.5px}
/* gráficos: base cinza tracejada para a linha de base, linhas de 2px, anéis nos pontos */
.chart polyline{stroke-width:2}
.chart .sR{stroke-width:2.5}
.chart .sLB{stroke:var(--ink-3);stroke-dasharray:6 4}
.chart circle.pt{stroke:var(--surface);stroke-width:2}
.clegend .sLB{border-top-color:var(--ink-3)}
.gauge em{border-left-color:var(--ink-3)}
.glegend .ge{border-top-color:var(--ink-3)}
.chart .hcol rect{fill:transparent;pointer-events:all}
.chart .hcol .cross{stroke:var(--ink-3);stroke-width:1;opacity:0;pointer-events:none}
.chart .hcol:hover .cross,.chart .hcol:focus .cross{opacity:.7}
.chart .hcol:focus{outline:none}
.chart .slot .hit{fill:var(--ink);opacity:0;pointer-events:all}
.chart .slot:hover .hit,.chart .slot:focus .hit{opacity:.05}
.chart .slot:focus{outline:none}
.chart .slot:hover .bar{filter:brightness(1.08)}
.ctip{position:fixed;z-index:60;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.14);padding:8px 10px;font-size:12.5px;min-width:170px;max-width:280px;display:grid;gap:3px}
.ctip[hidden]{display:none}
.ctip .h{font-weight:600;margin-bottom:2px}
.ctip .x{color:var(--ink-3);font-size:11.5px}
.ctip .r{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:8px;align-items:center}
.ctip .r .k{order:0;display:block;width:12px;height:3px;border-radius:2px;background:var(--ink-3)}
.ctip .r span{order:1;color:var(--ink-2)}
.ctip .r b{order:2;font-variant-numeric:tabular-nums;text-align:right}
.ctip .k.sR{background:var(--ok)}.ctip .k.sP{background:var(--wplan)}.ctip .k.sLB{background:var(--ink-3)}
.ctip .k.ba{background:var(--accent);height:8px}.ctip .k.bm{background:var(--m3)}.ctip .k.bp{width:8px;height:8px;border-radius:50%;border:2px solid var(--wplan);background:var(--surface)}
.sim .form3{grid-template-columns:repeat(3,minmax(0,1fr))}
.dgrid2 .sim .btn.ghost{align-self:auto}
@media (max-width:1280px){
  .dgrid2 .c8{grid-column:span 7}.dgrid2 .c4{grid-column:span 5}
  .mini2.four{grid-template-columns:1fr 1fr}
}
@media (max-width:1100px){
  .kstrip{grid-template-columns:repeat(4,minmax(0,1fr))}
  .tile.hero{grid-column:1 / -1;flex-direction:row;flex-wrap:wrap;align-items:baseline;column-gap:18px}
  .tile.hero .tl-l{flex-basis:100%}
  .tile.hero .tl-v{margin-top:0}
  .dgrid2 .c8,.dgrid2 .c4,.dgrid2 .c6{grid-column:1 / -1}
  .mini2.four{grid-template-columns:repeat(4,minmax(0,1fr))}
}
@media (max-width:680px){
  .kstrip{grid-template-columns:1fr 1fr;gap:8px}
  .tile{padding:11px 12px}
  .tile.st-bad,.tile.st-good{padding-left:15px}
  .tl-v{font-size:24px}
  .tile.hero .tl-v{font-size:46px}
  .dgrid2{gap:10px}
  .dgrid2 .card{padding:13px 13px}
  .mini2,.mini2.four{grid-template-columns:1fr 1fr}
  .sim .form3{grid-template-columns:1fr 1fr}

/* ---------- edição ---------- */
function putPend(T,id,s,val){
  PEND[T][id]=PEND[T][id]||{};
  var base=(STATE[T][id]&&STATE[T][id][s])||null;
  if(JSON.stringify(base)===JSON.stringify(val||null)){delete PEND[T][id][s];if(!Object.keys(PEND[T][id]).length)delete PEND[T][id]}
  else PEND[T][id][s]=val||null;
}
function setStatus(T,id,s,v){
  var cur=rec(T,id,s),d=UI.lanc||today(),n;
  if(v===0)n=null;
  else if(v===1)n={s:1,i:(cur&&cur.i)||d};
  else n={s:2,i:(cur&&cur.i&&cur.i<=d)?cur.i:d,c:(cur&&cur.s===2&&cur.c)?cur.c:d};
  if(cur&&cur.s===v&&v!==0)return;
  putPend(T,id,s,n);
}

function mergedState(){
  var s=JSON.parse(JSON.stringify(STATE));var n=0,ids=[];
  ["t","p"].forEach(function(T){Object.keys(PEND[T]).forEach(function(id){Object.keys(PEND[T][id]).forEach(function(k){var v=PEND[T][id][k];s[T][id]=s[T][id]||{};if(v)s[T][id][k]=v;else delete s[T][id][k];n++});if(s[T][id]&&!Object.keys(s[T][id]).length)delete s[T][id];ids.push(id)})});
  var nrp=Object.keys(PEND.x.rp).length;
  Object.keys(PEND.x.rp).forEach(function(id){var v=PEND.x.rp[id];if(v==="__LB")delete s.rp.o[id];else s.rp.o[id]=v;n++});
  if(nrp)s.rp.d=today();
  Object.keys(PEND.x.wk).forEach(function(k){var v=PEND.x.wk[k];if(v&&v.it&&(v.it.length||v.ob||v.ch||v.dt!=null))s.wk[k]=v;else delete s.wk[k];n++});
  return{s:s,n:n,ids:ids};
}
function buildHtml(st){

    '<title>'+TITLE+'</title>\n'+FONTS+'\n<style id="css">'+css+'</style>\n<div id="root"></div>\n'+
    '<'+SC+' type="application/json" id="geo">'+geo+'</'+SC+'>\n'+

    '<'+SC+' id="app">'+app+'</'+SC+'>\n</body></html>';

function progSet(T,s,on){

  if(m==="acomp")renderSvcBar();if(m==="plan")renderPlanBar();if(m==="prog")renderProgBar();
  renderBacia();if(m!=="painel")paint();renderEditBar();renderPanel();
  if(m==="painel")renderDash();
}

/* ---------- início ---------- */
renderAll();
UI.sel=UI.sel.filter(function(k){var p=k.split(":"),id=p.slice(1).join(":");return p[0]==="t"?!!TBY[id]:!!PBY[id]});
var MAPOK=false;
function ensureMap(){requestAnimationFrame(function(){
  if(UI.mode==="painel")return;
  if(!MAPOK){if(UI.view&&UI.view.w){V.x=UI.view.x;V.y=UI.view.y;V.w=UI.view.w;applyView()}else fit(BX);MAPOK=true}else applyView();
  drawSel();
})}
ensureMap();
if(pendCount())setTimeout(function(){toast("Há "+pendCount()+" alterações não salvas guardadas neste navegador.")},600);

if(window.claude&&window.claude.use){
  window.claude.use("downloads").then(function(d){EDIT.downloads=d}).catch(function(){});
  Promise.all([window.claude.use("user").catch(function(){return null}),window.claude.use("db").catch(function(){return null})]).then(function(r){
    var user=r[0],db=r[1];
    if(db)dbStart(db);
    if(!user||!db)return;
    Promise.all([user.isOwner(),user.canEdit(),user.can("data.write"),user.id()]).then(function(a){
      EDIT.owner=!!a[0];EDIT.can=!!(a[0]||a[1]||a[2]===true);EDIT.user=a[3]||null;renderAll();
    }).catch(function(){});
  });
}
})();
